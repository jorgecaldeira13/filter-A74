<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A7IV · 50mm Film Look</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121212;
    --panel: #1b1b1b;
    --border: #2c2c2c;
    --accent: #e8b565;
    --text: #eee;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 24px 10px;
    text-align: center;
  }
  header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 16px 24px 40px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .stage {
    flex: 1 1 480px;
    min-width: 280px;
  }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    min-height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    text-align: center;
    padding: 20px;
  }
  #dropzone.dragover {
    border-color: var(--accent);
    background: #1f1f1f;
  }
  #dropzone .hint { color: var(--muted); font-size: 0.85rem; }
  #dropzone.has-image {
    border-style: solid;
    padding: 0;
    min-height: 0;
    cursor: default;
  }
  canvas#preview {
    display: block;
    max-width: 100%;
    border-radius: 10px;
  }
  .canvas-wrap {
    position: relative;
    width: 100%;
  }
  .canvas-wrap canvas { width: 100%; height: auto; border-radius: 10px; }
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
    font-weight: 600;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .panel {
    flex: 1 1 300px;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    height: fit-content;
  }
  .panel h2 {
    font-size: 0.9rem;
    margin: 0 0 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .control { margin-bottom: 16px; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .control label span.val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .presets {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .presets button { flex: 1 1 auto; font-size: 0.78rem; padding: 7px 10px; }
  input[type="file"] { display: none; }
  #status { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 8px; min-height: 1.2em; }
  .compare-hint { text-align:center; font-size:0.75rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>Sony A7IV · 50mm Film Look</h1>
  <p>Upload a photo, get it back graded in a warm, filmic 50mm style.</p>
</header>

<div class="layout">
  <div class="stage">
    <div id="dropzone">
      <div class="hint" id="dropHint">
        <strong>Click to upload</strong> or drag a photo here<br>JPEG / PNG
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <div class="canvas-wrap" id="canvasWrap" style="display:none;">
        <canvas id="preview"></canvas>
      </div>
    </div>
    <div class="toolbar">
      <button id="btnUpload">Choose photo</button>
      <button id="btnToggle" disabled>Show original</button>
      <button id="btnDownload" class="primary" disabled>Download</button>
      <button id="btnReset" disabled>Reset sliders</button>
    </div>
    <div id="status"></div>
    <div class="compare-hint">Hold "Show original" to compare before/after.</div>
  </div>

  <div class="panel">
    <h2>Look</h2>
    <div class="presets">
      <button data-preset="a74">A7IV 50mm</button>
      <button data-preset="subtle">Subtle</button>
      <button data-preset="punchy">Punchy</button>
    </div>

    <h2>Adjust</h2>
    <div class="control">
      <label>Warmth / split-tone <span class="val" id="val-warmth">35</span></label>
      <input type="range" id="warmth" min="0" max="100" value="35">
    </div>
    <div class="control">
      <label>Contrast <span class="val" id="val-contrast">22</span></label>
      <input type="range" id="contrast" min="0" max="100" value="22">
    </div>
    <div class="control">
      <label>Faded blacks <span class="val" id="val-fade">18</span></label>
      <input type="range" id="fade" min="0" max="100" value="18">
    </div>
    <div class="control">
      <label>Saturation <span class="val" id="val-saturation">-8</span></label>
      <input type="range" id="saturation" min="-50" max="50" value="-8">
    </div>
    <div class="control">
      <label>Vignette <span class="val" id="val-vignette">32</span></label>
      <input type="range" id="vignette" min="0" max="100" value="32">
    </div>
    <div class="control">
      <label>Grain <span class="val" id="val-grain">14</span></label>
      <input type="range" id="grain" min="0" max="100" value="14">
    </div>
  </div>
</div>

<script>
(function () {
  const MAX_DIM = 2400;

  const dropzone = document.getElementById('dropzone');
  const dropHint = document.getElementById('dropHint');
  const fileInput = document.getElementById('fileInput');
  const canvasWrap = document.getElementById('canvasWrap');
  const canvas = document.getElementById('preview');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');

  const btnUpload = document.getElementById('btnUpload');
  const btnToggle = document.getElementById('btnToggle');
  const btnDownload = document.getElementById('btnDownload');
  const btnReset = document.getElementById('btnReset');

  const sliderIds = ['warmth', 'contrast', 'fade', 'saturation', 'vignette', 'grain'];
  const sliders = {};
  sliderIds.forEach(id => sliders[id] = document.getElementById(id));

  const presets = {
    a74:     { warmth: 35, contrast: 22, fade: 18, saturation: -8,  vignette: 32, grain: 14 },
    subtle:  { warmth: 18, contrast: 12, fade: 10, saturation: -4,  vignette: 16, grain: 6 },
    punchy:  { warmth: 45, contrast: 34, fade: 12, saturation: 6,   vignette: 42, grain: 18 }
  };

  let originalImageData = null; // pristine pixels at working resolution
  let width = 0, height = 0;
  let showingOriginal = false;

  function updateLabels() {
    sliderIds.forEach(id => {
      document.getElementById('val-' + id).textContent = sliders[id].value;
    });
  }

  function buildContrastLUT(amount0to100) {
    const c = (amount0to100 / 100) * 90; // contrast units 0-90
    const factor = (259 * (c + 255)) / (255 * (259 - c));
    const lut = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      lut[i] = factor * (i - 128) + 128;
    }
    return lut;
  }

  function clamp255(v) {
    return v < 0 ? 0 : (v > 255 ? 255 : v);
  }

  function applyFilter(params) {
    if (!originalImageData) return;
    const src = originalImageData.data;
    const out = ctx.createImageData(width, height);
    const d = out.data;

    const contrastLUT = buildContrastLUT(params.contrast);
    const liftFrac = (params.fade / 100) * 0.28;     // 0-0.28
    const blackPoint = 26;
    const warmth = params.warmth / 100;
    const satAdj = params.saturation / 100;          // -0.5 .. 0.5
    const vignetteAmt = params.vignette / 100;
    const grainAmt = params.grain / 100 * 22;         // stdev-ish px

    const cx = width / 2, cy = height / 2;
    const maxDist = Math.sqrt(cx * cx + cy * cy);

    let idx = 0;
    for (let y = 0; y < height; y++) {
      // precompute vignette factor per row/col below
      for (let x = 0; x < width; x++) {
        let r = src[idx], g = src[idx + 1], b = src[idx + 2];

        // 1. lift blacks (faded film)
        r = r * (1 - liftFrac) + blackPoint * liftFrac;
        g = g * (1 - liftFrac) + blackPoint * liftFrac;
        b = b * (1 - liftFrac) + blackPoint * liftFrac;

        // 2. contrast curve
        r = contrastLUT[r | 0];
        g = contrastLUT[g | 0];
        b = contrastLUT[b | 0];

        // 3. split toning: warm highlights, teal shadows
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const hi = lum;
        const sh = 1 - lum;
        r += warmth * (16 * hi - 7 * sh);
        g += warmth * (4 * hi - 2 * sh);
        b += warmth * (-12 * hi + 11 * sh);

        // 4. saturation
        const lum2 = 0.299 * r + 0.587 * g + 0.114 * b;
        r = lum2 + (r - lum2) * (1 + satAdj);
        g = lum2 + (g - lum2) * (1 + satAdj);
        b = lum2 + (b - lum2) * (1 + satAdj);

        // 5. vignette
        const dx = (x - cx) / maxDist;
        const dy = (y - cy) / maxDist;
        const dist = Math.sqrt(dx * dx + dy * dy) * 1.42; // normalize corner ~1
        let t = (dist - 0.35) / (1.1 - 0.35);
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        const smooth = t * t * (3 - 2 * t);
        const vf = 1 - vignetteAmt * smooth * 0.55;
        r *= vf; g *= vf; b *= vf;

        // 6. grain (luminance noise)
        if (grainAmt > 0) {
          const n = (Math.random() - 0.5) * grainAmt;
          r += n; g += n; b += n;
        }

        d[idx] = clamp255(r);
        d[idx + 1] = clamp255(g);
        d[idx + 2] = clamp255(b);
        d[idx + 3] = src[idx + 3];
        idx += 4;
      }
    }

    ctx.putImageData(out, 0, 0);
  }

  function currentParams() {
    const p = {};
    sliderIds.forEach(id => p[id] = Number(sliders[id].value));
    return p;
  }

  function render() {
    if (showingOriginal) {
      ctx.putImageData(originalImageData, 0, 0);
    } else {
      applyFilter(currentParams());
    }
  }

  function loadImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    statusEl.textContent = 'Loading…';
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, MAX_DIM / Math.max(w, h));
      w = Math.round(w * scale);
      h = Math.round(h * scale);
      width = w; height = h;
      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      originalImageData = ctx.getImageData(0, 0, w, h);
      URL.revokeObjectURL(url);

      dropzone.classList.add('has-image');
      dropHint.style.display = 'none';
      canvasWrap.style.display = 'block';
      btnToggle.disabled = false;
      btnDownload.disabled = false;
      btnReset.disabled = false;
      statusEl.textContent = '';
      render();
    };
    img.onerror = () => { statusEl.textContent = 'Could not load that image.'; };
    img.src = url;
  }

  // Upload interactions
  btnUpload.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('click', (e) => {
    if (!dropzone.classList.contains('has-image')) fileInput.click();
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) loadImageFile(e.target.files[0]);
  });

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    })
  );
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (file) loadImageFile(file);
  });

  // Sliders
  sliderIds.forEach(id => {
    sliders[id].addEventListener('input', () => {
      updateLabels();
      showingOriginal = false;
      render();
    });
  });

  // Toggle original (press and hold)
  function showOrig() { showingOriginal = true; render(); btnToggle.textContent = 'Showing original'; }
  function showFiltered() { showingOriginal = false; render(); btnToggle.textContent = 'Show original'; }
  btnToggle.addEventListener('mousedown', showOrig);
  btnToggle.addEventListener('touchstart', (e) => { e.preventDefault(); showOrig(); });
  ['mouseup', 'mouseleave'].forEach(evt => btnToggle.addEventListener(evt, showFiltered));
  btnToggle.addEventListener('touchend', showFiltered);

  // Reset
  btnReset.addEventListener('click', () => applyPreset('a74'));

  // Presets
  function applyPreset(name) {
    const p = presets[name];
    if (!p) return;
    sliderIds.forEach(id => sliders[id].value = p[id]);
    updateLabels();
    showingOriginal = false;
    render();
  }
  document.querySelectorAll('.presets button').forEach(b => {
    b.addEventListener('click', () => applyPreset(b.dataset.preset));
  });

  // Download
  btnDownload.addEventListener('click', () => {
    if (!originalImageData) return;
    showingOriginal = false;
    render();
    canvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'a7iv-50mm-filtered.jpg';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, 'image/jpeg', 0.93);
  });

  updateLabels();
})();
</script>

</body>
</html>
